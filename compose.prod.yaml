services:
  redis:
    image: redis:7-alpine
    container_name: retweet-redis
    volumes:
      - redis_data:/data
    networks:
      - retweet-network
    restart: unless-stopped

  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/retweet-backend:latest
    container_name: retweet-app
    env_file:
      - .env.prod
    environment:
      - DB_HOST=172.17.0.1  # EC2 호스트 IP — shared-mysql(sleact compose)에 접근
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - retweet-network
    restart: unless-stopped

networks:
  retweet-network:
    driver: bridge

volumes:
  redis_data:
